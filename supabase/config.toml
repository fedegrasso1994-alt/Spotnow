[functions.delete-account]
verify_jwt = true
# Gateway JWT protection remains enabled; auth.getUser also validates identity in the function.

[functions.photo-assets]
verify_jwt = true

[functions.profile-photo]
verify_jwt = true

# Device-check uses its revocable opaque binding proof; dispatch requires a separate secret.
# Supabase user JWT authorization remains inside authenticated registration/resolution RPCs.
[functions.notifications]
verify_jwt = false

[functions.operations]
verify_jwt = true
# Additional exact service credential check inside; no browser execution or scheduler.
