<!doctype html><html lang="it" ><meta charset="utf-8" ><meta name="viewport"  content="width=device-width,initial-scale=1" ><title>Soma — Bacheca UI sintetica</title><link rel="stylesheet"  href="/src/styles.css" ><body><div id="phone" ><section id="tribe"  class="screen active" ><button class="backlink" >← Le tue Tribe</button><h2 class="disp" >Tribe sintetica</h2><p id="tribeCount"  class="sub" >Persone</p><div id="tribeGrid" >Profili sintetici</div></section><button id="fail"  class="backlink" >Simula errore rete</button><button id="reset"  class="backlink" >Simula cambio account</button></div><script type="module">
import{mountBoard}from'/src/bacheca-ui.js';if(!import.meta.env.DEV)throw Error('DEV ONLY');let rows=[{id:'synthetic',text:'Post sintetico <img src=x onerror=alert(1)>',created_at:new Date().toISOString(),expires_at:new Date(Date.now()+86400000).toISOString(),can_delete:false,reactions:{'❤️':2},my_reaction:null}],remaining=3,fail=false;const api={operation:async()=>crypto.randomUUID(),feed:async()=>{if(fail)throw Error('NETWORK');return{items:rows,remaining,more:false};},create:async(place,text)=>{rows.unshift({id:crypto.randomUUID(),text,created_at:new Date().toISOString(),expires_at:new Date(Date.now()+86400000).toISOString(),can_delete:true,reactions:{},my_reaction:null});remaining--;},react:async(id,kind)=>{const p=rows.find(x=>x.id===id);p.my_reaction=kind;p.reactions=kind?{[kind]:1}:{};},remove:async id=>{rows=rows.filter(p=>p.id!==id);},report:async()=>{}};const board=mountBoard({root:document.querySelector('#tribe'),api,peopleNodes:[document.querySelector('#tribeCount'),document.querySelector('#tribeGrid')],onPeople:()=>{}});board.context('synthetic-only');document.querySelector('#fail').onclick=()=>{fail=!fail;board.refresh();};document.querySelector('#reset').onclick=()=>{board.reset();rows=[];board.context('other-synthetic-account');};
</script></body></html>
