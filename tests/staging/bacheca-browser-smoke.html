<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport"content="width=device-width,initial-scale=1"><title>Soma — Bacheca staging smoke</title><link rel="stylesheet"href="/src/styles.css"><body><div id="phone"><form id="auth"><h2 class="disp">Bacheca · collaudo sintetico</h2><input aria-label="Email fixture"type="email"required><input aria-label="Password fixture"type="password"required><input aria-label="Venue fixture"required><button class="btn btn-primary">Accedi alla fixture</button></form><p id="status"role="status"></p><section id="tribe"class="screen active"><h2 class="disp">Tribe sintetica</h2><p id="tribeCount">Persone della Tribe</p><div id="tribeGrid"></div></section><button id="exit"class="backlink">Esci</button></div><script type="module">
import{createClient}from'@supabase/supabase-js';import{boardEnabled,createBoardApi}from'/src/bacheca.js';import{mountBoard}from'/src/bacheca-ui.js';
if(!import.meta.env.DEV||!boardEnabled(import.meta.env))throw Error('STAGING ONLY');const client=createClient(import.meta.env.VITE_SUPABASE_URL,import.meta.env.VITE_SUPABASE_PUBLIC_KEY,{auth:{persistSession:false}});const status=document.querySelector('#status'),form=document.querySelector('#auth');const board=mountBoard({root:document.querySelector('#tribe'),api:createBoardApi(client),peopleNodes:[document.querySelector('#tribeCount'),document.querySelector('#tribeGrid')],onPeople:()=>{}});
form.onsubmit=async e=>{e.preventDefault();const inputs=form.querySelectorAll('input'),venue=inputs[2].value;const r=await client.auth.signInWithPassword({email:inputs[0].value,password:inputs[1].value});form.reset();if(r.error){status.textContent='Login negato';return;}board.context(venue);status.textContent='Sessione sintetica attiva';};document.querySelector('#exit').onclick=async()=>{board.reset();await client.auth.signOut();status.textContent='Sessione chiusa';};
</script></body></html>
